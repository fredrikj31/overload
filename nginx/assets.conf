server {
    listen       80;
    listen  [::]:80;

    root /usr/share/nginx/data;

    # Hide import bookkeeping (.dataset-ref, temporary download directories)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;

        # File names contain a content id (e.g. 0025-EIeI8Vf.gif), so they can be cached forever
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
