server {
    listen       80;
    listen  [::]:80;

    root /usr/share/nginx/data;

    # Hide import bookkeeping (.dataset-ref, temporary download directories)
    location ~ /\. {
        deny all;
    }

    # Served under /media/ on the public domain (Vite owns /assets/), e.g. /media/exercises/0025-EIeI8Vf.gif
    location /media/ {
        alias /usr/share/nginx/data/;

        # File names contain a content id (e.g. 0025-EIeI8Vf.gif), so they can be cached forever
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
