x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----- DEVELOPMENT -----
  dev-database:
    container_name: overload-database
    image: postgres:18-alpine
    restart: always
    profiles:
      - dev
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: overload
    ports:
      - 5432:5432
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d overload"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  dev-assets:
    container_name: overload-assets
    image: nginx:1.31.6-alpine
    restart: always
    profiles:
      - dev
    ports:
      - ${ASSETS_PORT:-5003}:80
    volumes:
      # Populated by running the seeder locally (pnpm seeder:run)
      - ./.data/assets:/usr/share/nginx/data:ro
      - ./nginx/assets.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging

  # ----- PRODUCTION -----
  database:
    container_name: overload-database
    image: postgres:18-alpine
    restart: always
    profiles:
      - prod
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: overload
    ports:
      - ${DATABASE_PORT:-5000}:5432
    networks:
      - overload-network
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d overload"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    container_name: overload-migrate
    image: ghcr.io/fredrikj31/overload-migrate:latest
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    profiles:
      - prod
    environment:
      DATABASE_HOST: overload-database
      DATABASE_PORT: 5432
      DATABASE_NAME: overload
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - overload-network
    logging: *default-logging

  # Downloads the exercises dataset into the assets volume and seeds the database. Skips if already imported.
  seeder:
    container_name: overload-seeder
    image: ghcr.io/fredrikj31/overload-seeder:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles:
      - prod
    environment:
      DATABASE_HOST: overload-database
      DATABASE_PORT: 5432
      DATABASE_NAME: overload
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ASSETS_DIR: /data
    networks:
      - overload-network
    volumes:
      - assets-data:/data
    logging: *default-logging

  assets:
    container_name: overload-assets
    image: nginx:1.31.6-alpine
    restart: always
    profiles:
      - prod
    networks:
      - cloudflared
    ports:
      - ${ASSETS_PORT:-5003}:80
    volumes:
      - assets-data:/usr/share/nginx/data:ro
      - ./nginx/assets.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging

  backend:
    container_name: overload-backend
    image: ghcr.io/fredrikj31/overload-backend:latest
    restart: always
    profiles:
      - prod
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_HOST: overload-database
      DATABASE_PORT: 5432
      DATABASE_NAME: overload
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      WEBSITE_BASE_URL: ${WEBSITE_BASE_URL}
    networks:
      - overload-network
      - cloudflared
    ports:
      - ${BACKEND_PORT:-5001}:3000
    logging: *default-logging

  frontend:
    container_name: overload-frontend
    image: ghcr.io/fredrikj31/overload-frontend:latest
    restart: always
    profiles:
      - prod
    environment:
      MY_APP_API_BASE_URL: ${MY_APP_API_BASE_URL}
    networks:
      - cloudflared
    ports:
      - ${FRONTEND_PORT:-5002}:80

networks:
  overload-network:
    driver: bridge
  cloudflared:
    external: true

volumes:
  database-data:
    name: overload-database-data
    driver: local
  assets-data:
    name: overload-assets-data
    driver: local
