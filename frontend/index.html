<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="manifest" href="manifest.webmanifest" />

    <!--
      Resolve the theme before any CSS or JS loads so the first painted frame already has the
      right background. Mirrors the logic in src/providers/theme.tsx (same storage key).
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("overload-theme");
        } catch (_) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <style>
      html {
        background-color: #ffffff;
        color-scheme: light;
      }
      html.dark {
        background-color: #171717;
        color-scheme: dark;
      }
    </style>
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#171717"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />

    <link rel="apple-touch-icon" href="/assets/images/icons/ios/180.png" />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/assets/images/icons/ios/120.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/assets/images/icons/ios/152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="/assets/images/icons/ios/167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/icons/ios/180.png"
    />

    <title>Overload</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
