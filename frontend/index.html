<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="manifest" href="manifest.webmanifest" />

    <!--
      Dark is the default. The manifest splash is a fixed #171717, so everything before React
      mounts must be dark too or the launch flashes. The theme-color meta drives the Android
      gesture bar and iOS status bar, so it is set from the resolved theme here rather than via
      a prefers-color-scheme media attribute (that would follow the OS, not the in-app choice).
    -->
    <style>
      html {
        background-color: #171717;
        color-scheme: dark;
      }
      html.light {
        background-color: #ffffff;
        color-scheme: light;
      }
    </style>
    <meta name="theme-color" content="#171717" />
    <!--
      Resolve the theme before any CSS or JS loads so the first painted frame already has the
      right background. Mirrors applyTheme in src/providers/theme.tsx (same storage key and
      colors).
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("overload-theme");
        } catch (_) {}
        var dark =
          theme === "light"
            ? false
            : theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : true;
        document.documentElement.classList.add(dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#171717" : "#ffffff");
      })();
    </script>

    <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />

    <link rel="apple-touch-icon" href="/assets/images/icons/ios/180.png" />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/assets/images/icons/ios/120.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/assets/images/icons/ios/152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="/assets/images/icons/ios/167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/icons/ios/180.png"
    />

    <title>Overload</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
